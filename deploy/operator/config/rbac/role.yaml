apiVersion: v1
kind: ServiceAccount
metadata:
  name: aam-operator
  namespace: aam-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aam-operator
  namespace: aam-system
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets", "persistentvolumeclaims", "serviceaccounts"]
    verbs: ["*"]
  - apiGroups: ["route.openshift.io"]
    resources: ["routes"]
    verbs: ["*"]
  - apiGroups: ["aam.openshift.io"]
    resources: ["aaminstances", "aaminstances/status", "aaminstances/finalizers"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aam-operator
  namespace: aam-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aam-operator
subjects:
  - kind: ServiceAccount
    name: aam-operator
    namespace: aam-system
