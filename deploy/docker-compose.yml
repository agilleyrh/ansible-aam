services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: aam
      POSTGRES_USER: aam
      POSTGRES_PASSWORD: aam
    ports:
      - "5432:5432"
    volumes:
      - aam-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aam -d aam"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  aam-api:
    build:
      context: ../backend
    environment:
      OPENSSL_armcap: "0"
    env_file:
      - ./env/backend.env.example
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  aam-worker:
    build:
      context: ../backend
    command: ["python", "-m", "app.worker"]
    environment:
      OPENSSL_armcap: "0"
    env_file:
      - ./env/backend.env.example
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  aam-scheduler:
    build:
      context: ../backend
    command: ["python", "-m", "app.scheduler"]
    environment:
      OPENSSL_armcap: "0"
    env_file:
      - ./env/backend.env.example
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  aam-ui:
    build:
      context: ../frontend
    environment:
      AAM_API_UPSTREAM: http://aam-api:8000
      AAM_DEFAULT_USER: developer
      AAM_DEFAULT_ROLES: aam.admin
    depends_on:
      - aam-api
    ports:
      - "8080:8080"

volumes:
  aam-postgres:
