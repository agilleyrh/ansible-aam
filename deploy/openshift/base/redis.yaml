apiVersion: apps/v1
kind: Deployment
metadata:
  name: aam-redis
  labels:
    app.kubernetes.io/name: aam-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aam-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aam-redis
    spec:
      serviceAccountName: aam-redis
      containers:
        - name: redis
          image: docker.io/library/redis:7-alpine
          imagePullPolicy: IfNotPresent
          command: ["redis-server", "--save", "", "--appendonly", "no", "--protected-mode", "no"]
          ports:
            - name: redis
              containerPort: 6379
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: aam-redis
  labels:
    app.kubernetes.io/name: aam-redis
spec:
  selector:
    app.kubernetes.io/name: aam-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
