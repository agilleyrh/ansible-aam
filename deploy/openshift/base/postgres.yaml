apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aam-postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aam-postgres
  labels:
    app.kubernetes.io/name: aam-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aam-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aam-postgres
    spec:
      serviceAccountName: aam-postgres
      containers:
        - name: postgres
          image: quay.io/sclorg/postgresql-16-c9s:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRESQL_USER
              valueFrom:
                secretKeyRef:
                  name: aam
                  key: database-user
            - name: POSTGRESQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: aam
                  key: database-password
            - name: POSTGRESQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: aam
                  key: database-name
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1"]
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/pgsql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: aam-postgres
---
apiVersion: v1
kind: Service
metadata:
  name: aam-postgres
  labels:
    app.kubernetes.io/name: aam-postgres
spec:
  selector:
    app.kubernetes.io/name: aam-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
